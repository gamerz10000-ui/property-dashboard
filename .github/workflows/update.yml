name: Update property dashboard

on:
  schedule:
    - cron: "17 5 */2 * *"   # every 2nd day, 05:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write   # push the encrypted database to the 'data' branch
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Check secrets
        env:
          SEARCHES: ${{ secrets.SEARCHES }}
        run: |
          [ -n "$DASHBOARD_PASSWORD" ] || { echo "DASHBOARD_PASSWORD secret is missing"; exit 1; }
          [ -n "$SEARCHES" ] || { echo "SEARCHES secret is missing"; exit 1; }

      - name: Restore saved data (if any)
        run: |
          mkdir -p work
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:properties.db.enc > work/properties.db.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -pass env:DASHBOARD_PASSWORD \
              -in work/properties.db.enc -out work/properties.db
            echo "Restored previous database"
          else
            echo "No saved data yet - first run"
          fi

      - name: Run property dashboard
        env:
          SEARCHES: ${{ secrets.SEARCHES }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          CLOUD_RUN: "1"
          DATA_DIR: work
          HTML_NAME: dashboard.html
        run: python property_dashboard.py --auto

      - name: Save data (encrypted)
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:DASHBOARD_PASSWORD \
            -in work/properties.db -out work/properties.db.enc
          rm -rf datarepo && mkdir datarepo
          cp work/properties.db.enc datarepo/
          cd datarepo
          git init -q -b data
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add properties.db.enc
          git commit -q -m "Update data"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Password-protect the page
        run: |
          mkdir -p site
          npx --yes staticrypt@3.5.4 work/dashboard.html \
            -p "$DASHBOARD_PASSWORD" --short --remember 30 -c false \
            -s 0123456789abcdef0123456789abcdef \
            --template-title "Property Dashboard" \
            --template-instructions "Enter password" \
            --template-color-primary "#1F5F4E" \
            -d site
          mv site/dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
